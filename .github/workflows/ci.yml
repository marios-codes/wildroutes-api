name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build, lint, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wildroutes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wildroutes_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildroutes_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wildroutes_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type-check
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  image-security:
    name: Build and scan container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --platform linux/amd64 --tag wildroutes-api:${{ github.sha }} .

      - name: Enforce image vulnerability threshold
        uses: docker/scout-action@v1
        with:
          command: cves
          image: 'local://wildroutes-api:${{ github.sha }}'
          platform: linux/amd64
          only-severities: critical,high
          only-fixed: true
          ignore-base: true
          exit-code: true
          summary: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
