# Dependabot version updates: scheduled pull requests that bump outdated dependencies.
# Every PR runs through CI before merge. Security alerts are a separate repository setting.
version: 2

updates:
  # npm: package.json and package-lock.json
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # @types/node must stay on the same major as the Node runtime we ship (22), because
      # the compiler trusts these type definitions. Minor and patch updates still arrive.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Major upgrades of the test runner and compiler need coordinated changes: vitest and
      # @vitest/coverage-v8 must move together, and typescript-eslint must first accept the new
      # TypeScript peer range. They are done by hand as deliberate tasks. Remove these rules
      # to be offered those majors again.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Must stay FIRST: Dependabot assigns each update to the first group that matches.
      # `prisma` (CLI, devDependency) and `@prisma/*` (client + adapter, dependencies)
      # must be upgraded together, so they share one PR. All update types are allowed here,
      # so a Prisma major arrives as one PR, not split across packages.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      # Dev tooling (ESLint, Vitest, TypeScript types...): minor and patch bundled into one PR.
      # Major bumps are deliberately left out and arrive as separate PRs for review.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Runtime dependencies (express, zod, pino...) are not grouped: one PR each,
    # so a change that reaches production is reviewed on its own.

  # docker: the node base image in the Dockerfile
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # engines (>=22 <23), CI (setup-node 22) and the Dockerfile must move to a new Node
      # major together, as one deliberate change, never through an automated PR.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  # github-actions: actions/checkout, actions/setup-node, etc. in .github/workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
