services:
  postgres:
    image: postgres:17
    container_name: wildroutes-postgres
    environment:
      POSTGRES_DB: wildroutes_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwordDev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
