services:
  postgres:
    image: postgres:17
    container_name: wildroutes-postgres
    environment:
      POSTGRES_DB: wildroutes_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwordDev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wildroutes_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: wildroutes-api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:passwordDev@postgres:5432/wildroutes_dev
      JWT_SECRET: docker-dev-secret
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
